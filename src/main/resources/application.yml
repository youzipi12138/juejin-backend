server:
  port: 8080
  shutdown: graceful
  # 部署在 Nginx 后，使用转发头获取真实 IP/协议
  forward-headers-strategy: native
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: juejin-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/juejin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 已有库（例如手工执行过 schema.sql）首次接入时以 V1 为基线
    baseline-on-migrate: true
    baseline-version: 1

  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      # 逻辑删除配置，对应实体上的 @TableLogic
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    # 生产环境请改为环境变量注入，长度至少 32 字节
    secret: ${JWT_SECRET:juejin-backend-please-change-this-secret-0123456789abcdef}
    # token 有效期（秒），同时作为 Redis 中 token 的 TTL
    expire-seconds: 86400

  sms:
    # 未接入第三方短信平台时使用模拟发送器
    mock: ${SMS_MOCK:true}
    # 仅 mock 模式下生效；生产环境必须设为 false，不要把验证码返回给调用方
    expose-code: ${SMS_EXPOSE_CODE:true}
    code-ttl: 5m
    send-interval: 60s
    max-attempts: 5
    daily-limit-per-phone: 10
    hourly-limit-per-ip: 30
    # 验证码哈希密钥，生产环境务必替换
    pepper: ${SMS_PEPPER:juejin-sms-pepper-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    com.juejin: debug
    com.juejin.mapper: debug
