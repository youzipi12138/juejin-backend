name: Deploy Dev

on:
  push:
    branches: [dev]
    paths-ignore:
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B -ntp clean verify

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dev
    env:
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_HOST }}
          username: ${{ secrets.DEV_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          port: 22
          script_stop: true
          envs: DEPLOY_SHA
          script: |
            cd /opt/juejin
            ./deploy.sh "$DEPLOY_SHA"
